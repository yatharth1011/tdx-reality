<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetric Cellular Flower</title>
    <style>
        :root {
            --bg-color: #030305;
            --panel-bg: rgba(15, 15, 20, 0.9);
            --text-color: #f0f0f0;
            --accent: #00e5ff;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #ui-container {
            position: absolute;
            top: 25px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 25px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 340px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff007f, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            background: linear-gradient(135deg, #00e5ff, #0055ff);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .stats {
            font-size: 0.8rem;
            color: #aaa;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
        }
        .stats span {
            color: var(--accent);
            font-weight: bold;
            float: right;
        }
        /* Fixed size square canvas */
        #canvas-wrapper {
            position: relative;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%);
            box-shadow: 0 0 60px rgba(0,0,0,1);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 900px) {
            #canvas-wrapper {
                width: 95vw;
                height: 95vw;
            }
            #ui-container {
                top: 10px;
                width: 90vw;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Cellular Flora</h1>
        <div class="input-group">
            <input type="text" id="numInput" value="14" placeholder="e.g. 12, 10^30, 1e20" autocomplete="off">
            <button onclick="generate()">Synthesize Pattern</button>
        </div>
        <div class="stats" id="statsBox">
            Symmetry Order: <span id="st-sym">-</span><br>
            Divergence Angle: <span id="st-div">-</span><br>
            Petal Harmonics: <span id="st-pet">-</span><br>
            Color Motif: <span id="st-col">-</span>
        </div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="flowerCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const size = 800;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        // String to Seeded PRNG (Avalanche Hash)
        function getSeededRandom(str) {
            let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
            for (let i = 0; i < str.length; i++) {
                let ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            let s = 4294967296 * (2097151 & h2) + (h1 >>> 0);
            
            return function() {
                let t = s += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // Handle commas, big e notation, and exponents
        function parseBigInt(str) {
            str = str.replace(/[\s,]+/g, '').toLowerCase();
            if (!str) return null;
            try {
                if (str.includes('e')) {
                    let [base, exp] = str.split('e');
                    return BigInt(Math.floor(Number(base))) * (10n ** BigInt(exp));
                }
                if (str.includes('^')) {
                    let [base, exp] = str.split('^');
                    return BigInt(base) ** BigInt(exp);
                }
                return BigInt(str);
            } catch (e) {
                return null;
            }
        }

        // Guarantees perfect K-fold mathematical symmetry while ensuring visual depth.
        function getSymmetryBig(N) {
            if (N === 1n) return { K: 1n, center: 1n, Q: 0n };
            
            // Prioritize highly composite/beautiful prime symmetries, with 1n included as a pure Fibonacci spiral fallback.
            const candidates = [64n, 60n, 48n, 36n, 32n, 30n, 24n, 20n, 18n, 16n, 14n, 13n, 12n, 11n, 10n, 9n, 8n, 7n, 6n, 5n, 4n, 3n, 2n, 1n];
            
            // To ensure breathtaking floral depth (multiple layers) even for small N,
            // we demand a minimum number of dots per arm (Q). 
            // Q >= 3 creates a beautiful layered interior rather than a flat ring.
            for (let minQ of [3n, 2n, 1n]) {
                for (let k of candidates) {
                    if (N % k === 0n && (N / k) >= minQ) return { K: k, center: 0n, Q: N / k };
                }
                for (let k of candidates) {
                    if ((N - 1n) % k === 0n && ((N - 1n) / k) >= minQ) return { K: k, center: 1n, Q: (N - 1n) / k };
                }
            }
            
            return { K: 1n, center: 0n, Q: N }; 
        }

        function generate() {
            const rawVal = document.getElementById('numInput').value;
            const N = parseBigInt(rawVal);
            
            if (N === null || N <= 0n) {
                alert("Please enter a valid positive integer.");
                return;
            }

            const rng = getSeededRandom(N.toString());
            const { K, center, Q } = getSymmetryBig(N);
            
            // Scale points for rendering constraints while mathematically keeping pattern structures intact.
            const MAX_RENDER_DOTS = 10000n;
            let Q_draw = Q;
            if (K * Q > MAX_RENDER_DOTS) {
                Q_draw = MAX_RENDER_DOTS / K;
                if (Q_draw < 1n) Q_draw = 1n;
            }

            const numArms = Number(K);
            const numDotsPerArm = Number(Q_draw);
            
            // Derive unique structural DNA from the BigInt hash
            const baseAngles = [0.618034, 0.414213, 0.732050, 0.236068, 0.280776];
            const baseAngle = baseAngles[Math.floor(rng() * baseAngles.length)];
            const angleOffset = (rng() - 0.5) * 0.05; 
            const divergence = baseAngle + angleOffset;
            const deltaTheta = Math.PI * 2 * divergence;

            // Deriving harmonic shape petals (must be multiple of K to preserve symmetry)
            const hasPetals = rng() > 0.3;
            const petalAmp = hasPetals ? (0.1 + rng() * 0.3) : 0;
            const petalFreq = hasPetals ? numArms * Math.floor(rng() * 4 + 1) : 0;

            // Generate Color Motif DNA
            const hue1 = rng() * 360;
            const hue2 = (hue1 + 120 + rng() * 120) % 360; // Guarantee contrasting secondary color
            const colorModes = ["Radial", "Angular", "By Arm", "By Density"];
            const colorModeIdx = Math.floor(rng() * colorModes.length);

            // Update UI Stats
            document.getElementById('st-sym').innerText = `${numArms}-fold`;
            document.getElementById('st-div').innerText = divergence.toFixed(5);
            document.getElementById('st-pet').innerText = hasPetals ? `${petalFreq} waves` : 'Perfect Circle';
            document.getElementById('st-col').innerText = colorModes[colorModeIdx];

            // Clear Background
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, size, size);
            
            const maxRadius = size / 2 - 35;
            const cx = size / 2;
            const cy = size / 2;

            let points = [];

            // Add center dot if mathematically required
            if (center === 1n) {
                points.push({ x: 0, y: 0, t: 0, arm: 0, theta: 0 });
            }

            // Generate perfect coordinate geometry
            for (let i = 1; i <= numDotsPerArm; i++) {
                let t = i / numDotsPerArm;
                let r_base = maxRadius * Math.sqrt(t);
                let theta_base = i * deltaTheta;
                
                // Petal Modulation (preserves K-fold symmetry since freq is multiple of K)
                let r_mod = 1 - petalAmp + petalAmp * Math.cos(petalFreq * theta_base);
                let r = r_base * r_mod;
                
                for (let k = 0; k < numArms; k++) {
                    let theta = theta_base + k * (Math.PI * 2 / numArms);
                    points.push({
                        x: r * Math.cos(theta),
                        y: r * Math.sin(theta),
                        t: t,
                        arm: k,
                        theta: theta
                    });
                }
            }

            // EXACT Spatial Hashing for Guaranteed Periphery Gaps
            const cellSize = maxRadius / 20; 
            const grid = new Map();
            
            function getCell(x, y) {
                return `${Math.floor(x / cellSize)},${Math.floor(y / cellSize)}`;
            }
            
            for (let p of points) {
                let key = getCell(p.x, p.y);
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(p);
            }

            for (let p of points) {
                let cx = Math.floor(p.x / cellSize);
                let cy = Math.floor(p.y / cellSize);
                let minDistSq = Infinity;
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        let key = `${cx + dx},${cy + dy}`;
                        if (grid.has(key)) {
                            for (let other of grid.get(key)) {
                                if (p === other) continue;
                                let distSq = (p.x - other.x)**2 + (p.y - other.y)**2;
                                if (distSq < minDistSq) minDistSq = distSq;
                            }
                        }
                    }
                }
                
                let minDist = Math.sqrt(minDistSq);
                
                // If N=1, give it a beautiful fixed size. 
                // Otherwise, mathematically bound the radius to 42% of the distance to the closest neighbor.
                // This guarantees at minimum an 16% gap between any two dots' peripheries (0.42 + 0.42 = 0.84).
                if (minDist === Infinity) {
                    p.radius = 35; 
                } else {
                    // Maximum cell dot size slightly increased to 35 so smaller numbers look plump and beautiful
                    p.radius = Math.max(0.5, Math.min(minDist * 0.42, 35));
                }
            }

            // Draw Phase
            ctx.save();
            ctx.translate(cx, cy);

            for (let p of points) {
                let h;
                if (colorModeIdx === 0) h = hue1 + (hue2 - hue1) * p.t; // Radial
                else if (colorModeIdx === 1) h = hue1 + (hue2 - hue1) * (Math.abs(p.theta % (Math.PI*2)) / (Math.PI*2)); // Angular
                else if (colorModeIdx === 2) h = (p.arm % 2 === 0) ? hue1 : hue2; // Arm alternating
                else h = hue1 + (p.radius / 35) * 120; // By Density/Size
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                
                // Solid meaningful colors based on DNA motif
                ctx.fillStyle = `hsl(${h % 360}, 90%, 65%)`;
                ctx.fill();

                // Draw delicate cellular borders to heavily emphasize exact separation
                ctx.strokeStyle = `rgba(0, 0, 0, 0.8)`;
                ctx.lineWidth = p.radius > 2 ? p.radius * 0.15 : 0.2;
                ctx.stroke();
            }

            ctx.restore();
        }

        window.onload = generate;

        document.getElementById('numInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
